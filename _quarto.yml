      - section: "전국 환경"
        contents:
          - text: "지지율·경제·외교"
            href: national.qmd
      - section: "상원 Senate"
        contents:
          - text: "전망 대시보드 — 주별 확률"
            href: dashboard.qmd
          - text: "경합주 표"
            href: senate.qmd
          - text: "시나리오 — 소수·50:50·다수"
            href: scenarios.qmd
          - section: "State Focus (9주)"
            contents:
              - states/ga.qmd
              - states/mi.qmd
              - states/nh.qmd
              - states/me.qmd
              - states/nc.qmd
              - states/tx.qmd
              - states/oh.qmd

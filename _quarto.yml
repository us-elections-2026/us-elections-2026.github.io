project:
  type: website
  execute-dir: project
  output-dir: _site
  render:        # 내부 문서(인계·메모·워크로그)는 사이트로 렌더하지 않음
    - "*.qmd"
    - "issues/"
    - "states/"
    - "governors/"
    - "!handoff.md"
    - "!NOTES_LOCAL.md"
    - "!README.md"
    - "!AGENTS.md"
    - "!worklogs/"
    # Dropbox 충돌 사본은 렌더하지 않는다 — glob("*.qmd")에 걸려 낡은 중복 페이지가
    # 라이브로 나가는 것을 막는 2차 방어선(1차는 .gitignore·publish_weekly.sh 가드).
    - "!*conflicted copy*"
    - "!*충돌 사본*"
  resources:
    - data/model_dashboard.json
    - data/model_v0.json
    - data/trends.json
    - data/national_econ.json
    - data/pollster_series.json
    - assets/candidates

lang: ko


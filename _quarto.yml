    center: "데이터 기준 시각은 각 표 상단에 표기됩니다. · 예측시장 가격은 확률의 근사일 뿐입니다."

format:
  html:
    include-in-header:
      # 서체 3단 체계(2026-09-01, textbooks-dashboard 차용) — 본문 IBM Plex Sans KR ·
      # 수치/기준일/라벨 JetBrains Mono · 제목/핵심 문장 Noto Serif KR.
      # IBM Plex Sans KR은 종전에 custom.scss에 선언만 있고 로드가 없어 시스템 폰트로
      # 폴백되고 있었다 — 이 링크가 그 선언을 실제로 살린다.
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
    theme:
      - litera
      - theme/custom.scss
    toc: true
    toc-title: 목차
    code-tools: false
    smooth-scroll: true

execute:
  echo: false
  warning: false
  message: false
  freeze: false   # 데이터가 바뀌면 매 빌드 다시 실행 (트래커 신선도 보장)
